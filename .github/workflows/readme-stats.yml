name: Update README stats cards

# The public github-readme-stats.vercel.app endpoint returns 503 DEPLOYMENT_PAUSED regularly
# (it's a shared free instance, overloaded by everyone using the same default URL). Generating
# static SVGs here instead means the cards live in this repo and never depend on that endpoint
# being up when a visitor loads the profile.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=material-palenight&border_color=61dafb&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&title_color=61dafb&text_color=ffffff&icon_color=61dafb&bg_color=292D3E&langs_count=8&layout=compact&border_color=61dafb&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README stats cards" || exit 0
          git push
